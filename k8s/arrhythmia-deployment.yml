apiVersion: apps/v1
kind: Deployment

metadata:
  name: arrhythmia

spec:
  replicas: 2

  selector:
    matchLabels:
      app: arrhythmia

  template:
    metadata:
      labels:
        app: arrhythmia

    spec:
      containers:
      - name: arrhythmia

        image: kruthikchethu/arrhythmia:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 5010
