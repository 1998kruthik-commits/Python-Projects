apiVersion: apps/v1
kind: Deployment
metadata:
  name: arrhythmia
spec:
  replicas: 2

  selector:
    matchLabels:
      app: arrhythmia

  template:
    metadata:
      labels:
        app: arrhythmia

    spec:
      containers:
        - name: arrhythmia
          image: kruthikchethu/arrhythmia:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 5010

---
apiVersion: v1
kind: Service
metadata:
  name: arrhythmia-service

spec:
  type: LoadBalancer

  selector:
    app: arrhythmia

  ports:
    - protocol: TCP
      port: 80
      targetPort: 5009
